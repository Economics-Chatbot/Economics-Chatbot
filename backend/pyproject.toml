[project]
name = "economymate-backend"
version = "0.1.0"
description = "FastAPI backend for the EconomyMate RAG chatbot PoC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic-settings>=2.10.0",
  "openai>=1.97.0",
  "pypdf>=6.14.0",
  "supabase>=2.16.0",
  "python-dotenv>=1.1.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
