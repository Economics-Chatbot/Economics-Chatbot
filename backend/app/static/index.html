<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EconomyMate BE2 - 벡터 검색 테스트</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --accent-green: #34d399;
            --accent-amber: #fbbf24;
            --accent-rose: #fb7185;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 1rem;
        }

        header .badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2));
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f8fafc 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .search-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 0.5rem;
            display: flex;
            gap: 0.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--accent-blue);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1.05rem;
            padding: 0.75rem 1rem;
        }

        .search-box button {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #0f172a;
            border: none;
            border-radius: 0.75rem;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .search-box button:hover {
            opacity: 0.9;
        }

        .search-box button:active {
            transform: scale(0.98);
        }

        .quick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        .quick-tags span {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .tag-chip {
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.35rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-chip:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .result-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.75rem;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            width: fit-content;
        }

        .status-answerable {
            background: rgba(52, 211, 153, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .status-suggestions {
            background: rgba(251, 191, 36, 0.15);
            color: var(--accent-amber);
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .status-not_found {
            background: rgba(251, 113, 133, 0.15);
            color: var(--accent-rose);
            border: 1px solid rgba(251, 113, 133, 0.3);
        }

        .term-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .term-def {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            background: var(--input-bg);
            padding: 1.25rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .related-section h4 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .suggestion-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .suggestion-item {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-item:hover {
            border-color: var(--accent-amber);
            transform: translateX(4px);
        }

        .suggestion-item .name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .suggestion-item .score {
            font-size: 0.85rem;
            color: var(--accent-amber);
            font-weight: 600;
        }

        .empty-placeholder {
            text-align: center;
            color: var(--text-secondary);
            padding: 3rem 1rem;
        }

        .empty-placeholder svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-secondary);
            opacity: 0.4;
            margin-bottom: 1rem;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-radius: 50%;
            border-top-color: var(--accent-blue);
            animation: spin 0.8s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">BE2 Vector Retrieval Live Test</div>
            <h1>EconomyMate 백엔드 벡터 검증 인터페이스</h1>
            <p>자연어 질문을 입력하여 벡터 검색 결과 및 3단계 판정을 실시간으로 테스트하세요.</p>
        </header>

        <form class="search-box" id="searchForm">
            <input type="text" id="queryInput" placeholder="예: GDP가 뭐야?, 기준금리가 오르면?, ICO란?" required autocomplete="off">
            <button type="submit" id="searchBtn">조회하기</button>
        </form>

        <div class="quick-tags">
            <span>테스트 샘플 질문:</span>
            <button type="button" class="tag-chip" onclick="setQuery('GDP가 뭐야?')">GDP가 뭐야?</button>
            <button type="button" class="tag-chip" onclick="setQuery('기준금리가 무슨 뜻인가요?')">기준금리가 무슨 뜻인가요?</button>
            <button type="button" class="tag-chip" onclick="setQuery('ICO')">ICO</button>
            <button type="button" class="tag-chip" onclick="setQuery('스프레드에 대해 설명해줘')">스프레드</button>
            <button type="button" class="tag-chip" onclick="setQuery('오늘 점심 메뉴 추천해줘')">오늘 점심 메뉴 추천해줘 (무관)</button>
        </div>

        <div class="result-panel" id="resultPanel">
            <div class="empty-placeholder">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <p>질문을 입력하고 조회 버튼을 누르시면 벡터 검색 판정 결과가 표시됩니다.</p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('searchForm');
        const input = document.getElementById('queryInput');
        const panel = document.getElementById('resultPanel');

        function setQuery(text) {
            input.value = text;
            executeSearch(text);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            executeSearch(input.value.trim());
        });

        async function executeSearch(query) {
            if (!query) return;

            panel.innerHTML = `<div class="spinner"></div><p style="text-align:center; color:var(--text-secondary)">OpenAI 임베딩 생성 및 Supabase 벡터 매칭 중...</p>`;

            try {
                const response = await fetch('/be2/vector-retrieve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    const msg = errData.detail?.message || `HTTP ${response.status} 오류`;
                    panel.innerHTML = `
                        <div class="status-badge status-not_found">❌ ERROR (${response.status})</div>
                        <h3 class="term-title">요청 처리 실패</h3>
                        <p class="term-def">${msg}</p>
                    `;
                    return;
                }

                const data = await response.json();
                renderResult(data);
            } catch (err) {
                panel.innerHTML = `
                    <div class="status-badge status-not_found">❌ SERVER CONNECTION ERROR</div>
                    <h3 class="term-title">연결 실패</h3>
                    <p class="term-def">${err.message}</p>
                `;
            }
        }

        function renderResult(data) {
            const { status, term, suggestions, query } = data;

            let html = '';

            if (status === 'answerable' && term) {
                html = `
                    <div class="status-badge status-answerable">✅ STATUS: ANSWERABLE (정확한 답변 가능)</div>
                    <h2 class="term-title">${escapeHtml(term.term_name)} <span style="font-size:0.9rem; color:var(--text-secondary)">(ID: ${term.term_id})</span></h2>
                    <div class="term-def">${escapeHtml(term.official_definition)}</div>
                `;
                if (term.related_terms && term.related_terms.length > 0) {
                    html += `
                        <div class="related-section">
                            <h4>관련 용어</h4>
                            <div class="quick-tags" style="margin-top:0.5rem">
                                ${term.related_terms.map(t => `<button type="button" class="tag-chip" onclick="setQuery('${escapeHtml(t)}')">${escapeHtml(t)}</button>`).join('')}
                            </div>
                        </div>
                    `;
                }
            } else if (status === 'suggestions' && suggestions && suggestions.length > 0) {
                html = `
                    <div class="status-badge status-suggestions">💡 STATUS: SUGGESTIONS (연관 용어 추천)</div>
                    <h3 style="margin-bottom:0.5rem">원하시는 용어가 아래 목록에 있나요?</h3>
                    <p style="color:var(--text-secondary); font-size:0.95rem; margin-bottom:1rem">질문 '${escapeHtml(query)}'와 관련된 후보 용어입니다.</p>
                    <div class="suggestion-list">
                        ${suggestions.map(s => `
                            <div class="suggestion-item" onclick="setQuery('${escapeHtml(s.term_name)}')">
                                <span class="name">${escapeHtml(s.term_name)}</span>
                                <span class="score">유사도: ${(s.similarity * 100).toFixed(1)}%</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                html = `
                    <div class="status-badge status-not_found">⚠️ STATUS: NOT_FOUND (결과 없음)</div>
                    <h3 class="term-title">관련 용어를 찾을 수 없습니다</h3>
                    <p class="term-def">질문 <strong>'${escapeHtml(query)}'</strong>에 대응하는 공식 경제/금융용어를 찾지 못했습니다.<br>다른 단어나 경제 키워드로 다시 질문해보세요.</p>
                `;
            }

            panel.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
